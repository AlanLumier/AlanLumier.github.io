<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎 · 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: #eef3f9;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .oobe {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(20, 50, 90, 0.14);
      padding: 44px 40px;
      text-align: center;
      min-height: 500px;
      display: flex;
      flex-direction: column;
    }

    .steps {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 36px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d3dbe6;
      transition: all 0.3s ease;
    }

    .dot.active {
      width: 26px;
      border-radius: 4px;
      background: #0067c0;
    }

    .step {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .step.active {
      display: flex;
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    p {
      color: #5b6570;
      font-size: 15px;
      line-height: 1.7;
    }

    .field {
      margin: 24px 0;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: #5b6570;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d3dbe6;
      border-radius: 8px;
      font-size: 15px;
      background: #fff;
      font-family: inherit;
    }

    input[type="text"]:focus,
    select:focus {
      outline: 2px solid #0067c0;
      outline-offset: -1px;
    }

    input.invalid {
      border-color: #d13438;
    }

    .avatar-upload {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin: 24px 0;
    }

    .avatar-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #e3eaf3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      color: #8a95a5;
      overflow: hidden;
      border: 1px solid #d3dbe6;
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #0067c0;
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #0059a8;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-secondary {
      background: #e8edf4;
      color: #1a1a1a;
    }

    .btn-secondary:hover {
      background: #d8e0ea;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: auto;
      padding-top: 12px;
    }

    .btn-row .btn {
      flex: 1;
    }

    .summary {
      text-align: left;
      background: #f5f8fc;
      border: 1px solid #e3eaf3;
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 14px;
    }

    .summary-row span:first-child {
      color: #5b6570;
    }

    .feedback {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #107c10;
      font-size: 15px;
      margin: 18px 0;
    }

    .feedback.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="oobe">
    <div class="steps" id="steps">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <!-- Step 0: 欢迎 -->
    <section class="step active" data-step="0">
      <h1 data-i18n="welcomeTitle">欢迎</h1>
      <p data-i18n="welcomeDesc">欢迎来到 AlanLumier 的个人空间。让我们先做一点简单设置。</p>
      <div class="btn-row">
        <button class="btn" data-next data-i18n="startBtn">开始设置</button>
      </div>
    </section>

    <!-- Step 1: 名字 -->
    <section class="step" data-step="1">
      <h2 data-i18n="nameTitle">你叫什么名字？</h2>
      <p data-i18n="nameDesc">这将用于在你的空间里称呼你。</p>
      <div class="field">
        <label data-i18n="nameLabel">你的名字</label>
        <input type="text" id="nameInput" maxlength="30" placeholder="请输入你的名字" />
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" data-prev data-i18n="prevBtn">上一步</button>
        <button class="btn" data-next data-i18n="nextBtn">下一步</button>
      </div>
    </section>

    <!-- Step 2: 头像 -->
    <section class="step" data-step="2">
      <h2 data-i18n="avatarTitle">选择头像</h2>
      <p data-i18n="avatarDesc">上传一张头像（可选），会保存在本地浏览器中。</p>
      <div class="avatar-upload">
        <div class="avatar-preview" id="avatarPreview">👤</div>
        <input type="file" id="avatarInput" accept="image/*" style="display: none" />
        <button class="btn btn-secondary" type="button" id="avatarBtn" data-i18n="avatarBtn">选择图片</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" data-prev data-i18n="prevBtn">上一步</button>
        <button class="btn" data-next data-i18n="nextBtn">下一步</button>
      </div>
    </section>

    <!-- Step 3: 语言和地区 -->
    <section class="step" data-step="3">
      <h2 data-i18n="langTitle">语言和地区</h2>
      <p data-i18n="langDesc">选择你的语言和所在地区。</p>
      <div class="field">
        <label data-i18n="langLabel">语言</label>
        <select id="langSelect">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="regionLabel">地区</label>
        <select id="regionSelect">
          <option value="CN">中国</option>
          <option value="US">United States</option>
          <option value="JP">日本</option>
          <option value="KR">韩国</option>
          <option value="GB">United Kingdom</option>
          <option value="DE">Germany</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" data-prev data-i18n="prevBtn">上一步</button>
        <button class="btn" data-next data-i18n="nextBtn">下一步</button>
      </div>
    </section>

    <!-- Step 4: 完成 -->
    <section class="step" data-step="4">
      <h2 data-i18n="doneTitle">准备就绪</h2>
      <p data-i18n="doneDesc">确认你的设置，然后开始使用。</p>
      <div class="summary" id="summary"></div>
      <div class="feedback" id="feedback">✓ <span data-i18n="doneFeedback">设置已完成，正在进入...</span></div>
      <div class="btn-row">
        <button class="btn btn-secondary" data-prev data-i18n="prevBtn">上一步</button>
        <button class="btn" id="finishBtn" data-i18n="finishBtn">完成设置</button>
      </div>
    </section>
  </div>

  <script>
    (function () {
      var STORAGE_KEY = "oobe";
      var TOTAL = 5;
      var current = 0;
      var state = { name: "", avatar: "", language: "zh", region: "CN" };

      // 已完成设置则直接进入主页
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          var parsed = JSON.parse(saved);
          if (parsed && parsed.completedAt) {
            location.replace("index.html");
            return;
          }
        } catch (e) {}
      }

      var i18n = {
        zh: {
          welcomeTitle: "欢迎",
          welcomeDesc: "欢迎来到 AlanLumier 的个人空间。让我们先做一点简单设置。",
          startBtn: "开始设置",
          nameTitle: "你叫什么名字？",
          nameDesc: "这将用于在你的空间里称呼你。",
          nameLabel: "你的名字",
          namePlaceholder: "请输入你的名字",
          avatarTitle: "选择头像",
          avatarDesc: "上传一张头像（可选），会保存在本地浏览器中。",
          avatarBtn: "选择图片",
          langTitle: "语言和地区",
          langDesc: "选择你的语言和所在地区。",
          langLabel: "语言",
          regionLabel: "地区",
          prevBtn: "上一步",
          nextBtn: "下一步",
          doneTitle: "准备就绪",
          doneDesc: "确认你的设置，然后开始使用。",
          finishBtn: "完成设置",
          doneFeedback: "设置已完成，正在进入...",
          summaryName: "名字",
          summaryAvatar: "头像",
          summaryLang: "语言",
          summaryRegion: "地区",
          avatarSet: "已设置",
          avatarNotSet: "未设置",
          nameRequired: "请输入名字"
        },
        en: {
          welcomeTitle: "Welcome",
          welcomeDesc: "Welcome to AlanLumier's personal space. Let's do a quick setup.",
          startBtn: "Get Started",
          nameTitle: "What's your name?",
          nameDesc: "This will be used to greet you in your space.",
          nameLabel: "Your name",
          namePlaceholder: "Enter your name",
          avatarTitle: "Choose an avatar",
          avatarDesc: "Upload an avatar (optional). It will be saved locally.",
          avatarBtn: "Choose image",
          langTitle: "Language & Region",
          langDesc: "Choose your language and region.",
          langLabel: "Language",
          regionLabel: "Region",
          prevBtn: "Back",
          nextBtn: "Next",
          doneTitle: "You're all set",
          doneDesc: "Review your settings and start.",
          finishBtn: "Finish",
          doneFeedback: "Setup complete, entering...",
          summaryName: "Name",
          summaryAvatar: "Avatar",
          summaryLang: "Language",
          summaryRegion: "Region",
          avatarSet: "Set",
          avatarNotSet: "Not set",
          nameRequired: "Please enter your name"
        }
      };

      function t(key) {
        var lang = state.language in i18n ? state.language : "en";
        return i18n[lang][key] || i18n.en[key] || key;
      }

      function applyI18n() {
        var lang = state.language in i18n ? state.language : "en";
        var dict = i18n[lang] || i18n.en;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });
        var nameInput = document.getElementById("nameInput");
        if (nameInput) nameInput.setAttribute("placeholder", t("namePlaceholder"));
        document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
      }

      function showStep(n) {
        current = n;
        document.querySelectorAll(".step").forEach(function (s) {
          s.classList.toggle("active", Number(s.getAttribute("data-step")) === n);
        });
        document.querySelectorAll(".dot").forEach(function (d, i) {
          d.classList.toggle("active", i === n);
        });
        if (n === 4) renderSummary();
      }

      function renderSummary() {
        var summary = document.getElementById("summary");
        summary.innerHTML = "";
        var rows = [
          [t("summaryName"), state.name || "-"],
          [t("summaryAvatar"), state.avatar ? t("avatarSet") : t("avatarNotSet")],
          [t("summaryLang"), state.language],
          [t("summaryRegion"), state.region]
        ];
        rows.forEach(function (r) {
          var row = document.createElement("div");
          row.className = "summary-row";
          var a = document.createElement("span");
          a.textContent = r[0];
          var b = document.createElement("span");
          b.textContent = r[1];
          row.appendChild(a);
          row.appendChild(b);
          summary.appendChild(row);
        });
      }

      document.querySelectorAll("[data-next]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (current === 1) {
            var nameInput = document.getElementById("nameInput");
            var v = nameInput.value.trim();
            if (!v) {
              nameInput.classList.add("invalid");
              nameInput.placeholder = t("nameRequired");
              nameInput.focus();
              return;
            }
            nameInput.classList.remove("invalid");
            state.name = v;
          }
          if (current < TOTAL - 1) showStep(current + 1);
        });
      });

      document.querySelectorAll("[data-prev]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          if (current > 0) showStep(current - 1);
        });
      });

      document.getElementById("nameInput").addEventListener("input", function (e) {
        e.target.classList.remove("invalid");
      });

      var avatarInput = document.getElementById("avatarInput");
      document.getElementById("avatarBtn").addEventListener("click", function () {
        avatarInput.click();
      });
      avatarInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var size = 128;
            var canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext("2d");
            var minSide = Math.min(img.width, img.height);
            var sx = (img.width - minSide) / 2;
            var sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
            var dataUrl = canvas.toDataURL("image/jpeg", 0.85);
            state.avatar = dataUrl;
            var preview = document.getElementById("avatarPreview");
            preview.innerHTML = "";
            var previewImg = document.createElement("img");
            previewImg.src = dataUrl;
            preview.appendChild(previewImg);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      document.getElementById("langSelect").addEventListener("change", function (e) {
        state.language = e.target.value;
        applyI18n();
      });

      document.getElementById("regionSelect").addEventListener("change", function (e) {
        state.region = e.target.value;
      });

      document.getElementById("finishBtn").addEventListener("click", function () {
        var data = {
          name: state.name,
          avatar: state.avatar,
          language: state.language,
          region: state.region,
          completedAt: Date.now()
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (err) {
          // 头像过大导致存储失败时，降级为不存头像
          delete data.avatar;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        var feedback = document.getElementById("feedback");
        feedback.classList.add("show");
        setTimeout(function () {
          location.href = "index.html";
        }, 1000);
      });

      applyI18n();
    })();
  </script>
</body>
</html>
