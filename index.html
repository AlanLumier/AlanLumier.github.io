<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AlanLumier 的个人空间" />
  <meta name="color-scheme" content="light dark" />
  <title>AlanLumier · 个人空间</title>
  <script>
    // 在样式解析前确定主题，避免暗色用户看到浅色闪烁（FOUC）
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute(
        "data-theme",
        stored || (prefersDark ? "dark" : "light")
      );
    })();
  </script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffeae1 0%, #b6faff 100%);
      --text: #1f2430;
      --text-secondary: #5b6472;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #e6e8ef;
      --radius: 16px;
      --glass: rgba(255, 255, 255, 0.55);
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #1a1d24 0%, #0f1115 100%);
      --text: #e6e8ee;
      --text-secondary: #9aa3b2;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2e3a;
      --glass: rgba(26, 29, 36, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: 84px;
      transition: color 0.3s ease;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hero {
      width: 100%;
      max-width: 720px;
      padding: 24px;
      text-align: center;
    }

    .greeting {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.5px;
      margin-top: 24px;
    }

    .wave {
      display: inline-block;
      animation: wave 1.6s ease-in-out infinite;
      transform-origin: 60% 85%;
      vertical-align: middle;
    }

    .wave-hand {
      display: block;
      width: 0.92em;
      height: 0.92em;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(16deg); }
      40% { transform: rotate(-6deg); }
      60% { transform: rotate(12deg); }
      80% { transform: rotate(-4deg); }
    }

    @media (max-width: 480px) {
      .greeting {
        font-size: 32px;
      }
    }

    .theme-toggle {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--border);
      color: var(--text);
    }

    .theme-toggle morph-icon {
      display: inline-flex;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 44px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tagline {
      margin-top: 16px;
      color: var(--text-secondary);
      font-size: 18px;
    }

    .links {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 48px;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .footer.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .footer-brand {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 圆形扩散转场（View Transitions API） */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: circular-reveal 0.5s ease-out;
    }

    @keyframes circular-reveal {
      from {
        clip-path: circle(0 at var(--click-x, 50%) var(--click-y, 50%));
      }
      to {
        clip-path: circle(var(--click-r, 100vmax) at var(--click-x, 50%) var(--click-y, 50%));
      }
    }

    /* 转场播放期间禁用普通 transition，避免新快照捕获到过渡中间色 */
    .vt-active * {
      transition: none !important;
    }

    /* ===== 首次引导模态层（贴合主题 / 毛玻璃） ===== */
    .oobe-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 18, 26, 0.15);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
    }

    .oobe-overlay.show {
      display: flex;
    }

    .oobe-panel {
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(15, 30, 60, 0.25);
      backdrop-filter: blur(26px) saturate(180%);
      -webkit-backdrop-filter: blur(26px) saturate(180%);
      padding: 32px;
      text-align: center;
      color: var(--text);
    }

    .oobe-steps {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 30px;
    }

    .oobe-step-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      background: var(--border);
      opacity: 0.45;
      transition: all 0.3s ease;
    }

    .oobe-step-icon.active {
      background: var(--accent);
      color: #fff;
      opacity: 1;
      transform: scale(1.12);
    }

    .oobe-step {
      display: none;
    }

    .oobe-step.active {
      display: block;
    }

    .oobe-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .oobe-desc {
      color: var(--text-secondary);
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .oobe-field {
      text-align: left;
      margin: 18px 0;
    }

    .oobe-field label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .oobe-input,
    .oobe-select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: transparent;
      color: var(--text);
      font-family: inherit;
    }

    .oobe-input:focus,
    .oobe-select:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    .oobe-input.invalid {
      border-color: #d13438;
    }

    .oobe-avatar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
    }

    .oobe-avatar-preview {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      color: var(--text-secondary);
      overflow: hidden;
    }

    .oobe-avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .oobe-summary {
      text-align: left;
      background: var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 20px 0;
      font-size: 14px;
    }

    .oobe-summary-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
    }

    .oobe-summary-row span:first-child {
      color: var(--text-secondary);
    }

    .oobe-btns {
      display: flex;
      gap: 12px;
      margin-top: 26px;
    }

    .oobe-btn {
      flex: 1;
      padding: 12px 24px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .oobe-btn:hover {
      background: var(--accent-hover);
    }

    .oobe-btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .oobe-btn-secondary:hover {
      background: var(--border);
    }

    .oobe-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .oobe-feedback {
      display: none;
      justify-content: center;
      color: #107c10;
      font-size: 15px;
      margin-top: 16px;
    }

    .oobe-feedback.show {
      display: flex;
    }

    body.oobe-open {
      overflow: hidden;
    }
  </style>
</head>
<body>

  <footer class="footer" id="footer">

  <!-- 首次引导模态层（毛玻璃悬浮） -->
  <div class="oobe-overlay" id="oobe-overlay" aria-hidden="true">
    <div class="oobe-panel">
      <div class="oobe-steps">

      <section class="oobe-step" data-step="3">

      <div class="oobe-btns">
        <button class="oobe-btn oobe-btn-secondary" id="oobePrev" disabled>上一步</button>
        <button class="oobe-btn" id="oobeNext">下一步</button>
      </div>

  <script>
    // 页脚淡入：进入视口时添加 is-visible 类触发淡入
    var footerEl = document.getElementById("footer");
    if ("IntersectionObserver" in window) {
      var footerObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            footerEl.classList.add("is-visible");
            footerObserver.unobserve(footerEl);
          }
        });
      }, { threshold: 0.15 });
      footerObserver.observe(footerEl);
    } else {
      footerEl.classList.add("is-visible");
    }
  </script>

  <script src="./dist/morphicons.bundle.js"></script>
  <script>
    defineMorphIcon();

    var MOON = [["path", { d: "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" }]];
    var SUN = [
      ["circle", { cx: "12", cy: "12", r: "5" }],
      ["line", { x1: "12", y1: "1", x2: "12", y2: "3" }],
      ["line", { x1: "12", y1: "21", x2: "12", y2: "23" }],
      ["line", { x1: "4.22", y1: "4.22", x2: "5.64", y2: "5.64" }],
      ["line", { x1: "18.36", y1: "18.36", x2: "19.78", y2: "19.78" }],
      ["line", { x1: "1", y1: "12", x2: "3", y2: "12" }],
      ["line", { x1: "21", y1: "12", x2: "23", y2: "12" }],
      ["line", { x1: "4.22", y1: "19.78", x2: "5.64", y2: "18.36" }],
      ["line", { x1: "18.36", y1: "5.64", x2: "19.78", y2: "4.22" }]
    ];

    var themeToggle = document.getElementById("theme-toggle");
    var themeIcon = document.getElementById("theme-icon");
    var isDark = function () {
      return document.documentElement.getAttribute("data-theme") === "dark";
    };

    // 初始图标（birth，不触发动画）
    themeIcon.icon = isDark() ? SUN : MOON;

    // 点击切换主题（圆形扩散转场 + 图标形变）
    themeToggle.addEventListener("click", function (event) {
      var next = isDark() ? "light" : "dark";

      var x = event.clientX;
      var y = event.clientY;
      var radius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );
      document.documentElement.style.setProperty("--click-x", x + "px");
      document.documentElement.style.setProperty("--click-y", y + "px");
      document.documentElement.style.setProperty("--click-r", radius + "px");

      var applyTheme = function () {
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      };

      if (document.startViewTransition) {
        var rootEl = document.documentElement;
        rootEl.classList.add("vt-active");
        var vt = document.startViewTransition(applyTheme);
        vt.finished.finally(function () {
          rootEl.classList.remove("vt-active");
        });
      } else {
        applyTheme();
      }

      // 月亮 ↔ 太阳形变
      themeIcon.morphTo(next === "dark" ? SUN : MOON, "snappy");
    });
  </script>

  <script>
    // 首次引导（悬浮模态层）+ Hero 名字/头像填充
    (function () {
      var STORAGE_KEY = "oobe";
      var overlay = document.getElementById("oobe-overlay");
      if (!overlay) return;

      var steps = overlay.querySelectorAll(".oobe-step");
      var icons = overlay.querySelectorAll(".oobe-step-icon");
      var nextBtn = document.getElementById("oobeNext");
      var prevBtn = document.getElementById("oobePrev");
      var nameInput = document.getElementById("oobeName");
      var langSelect = document.getElementById("oobeLang");
      var regionSelect = document.getElementById("oobeRegion");
      var avatarPreview = document.getElementById("oobeAvatarPreview");
      var avatarInput = document.getElementById("oobeAvatarInput");
      var avatarBtn = document.getElementById("oobeAvatarBtn");
      var summary = document.getElementById("oobeSummary");
      var feedback = document.getElementById("oobeFeedback");
      var doneTitle = document.getElementById("oobeDoneTitle");

      var TOTAL = 4;
      var current = 0;
      var state = { name: "", avatar: "", language: "zh", region: "CN" };

      function showStep(n) {
        current = n;
        steps.forEach(function (s) {
          s.classList.toggle("active", Number(s.getAttribute("data-step")) === n);
        });
        icons.forEach(function (ic, i) {
          ic.classList.toggle("active", i === n);
        });
        prevBtn.disabled = n === 0;
        nextBtn.textContent = n === TOTAL - 1 ? "完成设置" : "下一步";
        if (n === TOTAL - 1) renderSummary();
      }

      function renderSummary() {
        summary.innerHTML = "";
        var rows = [
          ["名字", state.name || "-"],
          ["头像", state.avatar ? "已设置" : "未设置"],
          ["语言", state.language],
          ["地区", state.region]
        ];
        rows.forEach(function (r) {
          var row = document.createElement("div");
          row.className = "oobe-summary-row";
          var a = document.createElement("span");
          a.textContent = r[0];
          var b = document.createElement("span");
          b.textContent = r[1];
          row.appendChild(a);
          row.appendChild(b);
          summary.appendChild(row);
        });
        doneTitle.textContent = "欢迎你，" + (state.name || "") + "！";
      }

      nextBtn.addEventListener("click", function () {
        if (current === 0) {
          var v = nameInput.value.trim();
          if (!v) {
            nameInput.classList.add("invalid");
            nameInput.focus();
            return;
          }
          nameInput.classList.remove("invalid");
          state.name = v;
        }
        if (current < TOTAL - 1) {
          showStep(current + 1);
        } else {
          finish();
        }
      });

      prevBtn.addEventListener("click", function () {
        if (current > 0) showStep(current - 1);
      });

      nameInput.addEventListener("input", function () {
        nameInput.classList.remove("invalid");
      });

      avatarBtn.addEventListener("click", function () {
        avatarInput.click();
      });

      avatarInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var img = new Image();
          img.onload = function () {
            var size = 128;
            var canvas = document.createElement("canvas");
            canvas.width = size;
            canvas.height = size;
            var ctx = canvas.getContext("2d");
            var minSide = Math.min(img.width, img.height);
            var sx = (img.width - minSide) / 2;
            var sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
            state.avatar = canvas.toDataURL("image/jpeg", 0.85);
            avatarPreview.innerHTML = "";
            var img2 = document.createElement("img");
            img2.src = state.avatar;
            avatarPreview.appendChild(img2);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });

      langSelect.addEventListener("change", function () {
        state.language = langSelect.value;
      });

      regionSelect.addEventListener("change", function () {
        state.region = regionSelect.value;
      });

      function finish() {
        var data = {
          name: state.name,
          avatar: state.avatar,
          language: state.language,
          region: state.region,
          completedAt: Date.now()
        };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (e) {
          delete data.avatar;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        feedback.classList.add("show");
        setTimeout(function () {
          closeOobe();
          applyHero(data);
        }, 900);
      }

      function closeOobe() {
        overlay.classList.remove("show");
        overlay.setAttribute("aria-hidden", "true");
        document.body.classList.remove("oobe-open");
      }

      function applyHero(data) {
        if (!data) return;
        if (data.name) {
          var greeting = document.querySelector(".greeting");
          if (greeting) {
            var prefix = data.language === "en" ? "Hi, I'm " : "你好，我是 ";
            for (var i = 0; i < greeting.childNodes.length; i++) {
              var node = greeting.childNodes[i];
              if (node.nodeType === 3) {
                node.textContent = prefix + data.name + " ";
                break;
              }
            }
          }
        }
        if (data.avatar) {
          var avatar = document.querySelector(".avatar");
          if (avatar) {
            avatar.innerHTML = "";
            var img = document.createElement("img");
            img.src = data.avatar;
            img.alt = "";
            avatar.appendChild(img);
          }
        }
      }

      // 读取已保存设置：已完成则直接填充，未完成则弹出引导
      var saved = localStorage.getItem(STORAGE_KEY);
      var done = false;
      var savedData = null;
      if (saved) {
        try {
          savedData = JSON.parse(saved);
          if (savedData && savedData.completedAt) done = true;
        } catch (e) {}
      }

      if (done) {
        applyHero(savedData);
      } else {
        overlay.classList.add("show");
        overlay.setAttribute("aria-hidden", "false");
        document.body.classList.add("oobe-open");
        showStep(0);
      }
    })();
  </script>
</body>
</html>
