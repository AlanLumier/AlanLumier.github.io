<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AlanLumier 的个人空间" />
  <meta name="color-scheme" content="light dark" />
  <title>AlanLumier · 个人空间</title>
  <script>
    // 在样式解析前确定主题，避免暗色用户看到浅色闪烁（FOUC）
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute(
        "data-theme",
        stored || (prefersDark ? "dark" : "light")
      );
    })();
  </script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --text-secondary: #5b6472;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #e6e8ef;
      --radius: 16px;
      --glass: rgba(255, 255, 255, 0.55);
      --glow-1: rgba(99, 102, 241, 0.14);
      --glow-2: rgba(79, 70, 229, 0.10);
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e6e8ee;
      --text-secondary: #9aa3b2;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2e3a;
      --glass: rgba(26, 29, 36, 0.55);
      --glow-1: rgba(99, 102, 241, 0.22);
      --glow-2: rgba(129, 140, 248, 0.14);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 80% -10%, var(--glow-1), transparent 60%),
        radial-gradient(1000px 500px at 0% 110%, var(--glow-2), transparent 60%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: 84px;
      transition: color 0.3s ease;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(31, 36, 48, 0.06);
      width: 100%;
      max-width: 560px;
      padding: 48px 40px;
      text-align: center;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--border);
      color: var(--text);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* 浅色主题显示月亮（提示可切暗色），暗色主题显示太阳（提示可切亮色） */
    .icon-sun {
      display: none;
    }
    [data-theme="dark"] .icon-moon {
      display: none;
    }
    [data-theme="dark"] .icon-sun {
      display: block;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 40px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .tagline {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .divider {
      width: 48px;
      height: 3px;
      margin: 24px auto;
      border-radius: 2px;
      background: var(--accent);
    }

    .about {
      text-align: left;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .about p + p {
      margin-top: 10px;
    }

    .links {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .footer {
      margin-top: 24px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    /* 圆形扩散转场（View Transitions API） */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: circular-reveal 0.5s ease-out;
    }

    @keyframes circular-reveal {
      from {
        clip-path: circle(0 at var(--click-x, 50%) var(--click-y, 50%));
      }
      to {
        clip-path: circle(var(--click-r, 100vmax) at var(--click-x, 50%) var(--click-y, 50%));
      }
    }

    /* 转场播放期间禁用普通 transition，避免新快照捕获到过渡中间色 */
    .vt-active * {
      transition: none !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">AlanLumier</span>
    <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>

  <main class="card">
    <div class="avatar" aria-hidden="true">A</div>
    <p class="tagline">欢迎来到我的个人空间</p>
    <div class="divider"></div>

    <section class="about">
      <p>
        你好，我是 Alan。这里是我的个人空间，用来记录和分享我的想法、项目与生活。
      </p>
      <p>
        目前内容还在逐步完善中，敬请期待。
      </p>
    </section>

    <nav class="links">
      <a class="btn btn-primary" href="https://github.com/AlanLumier" target="_blank" rel="noopener">
        GitHub
      </a>
    </nav>
  </main>

  <footer class="footer">
    © <span id="year"></span> AlanLumier
  </footer>

  <script>
    var themeToggle = document.getElementById("theme-toggle");

    // 让页脚年份自动更新，避免每年手动修改
    document.getElementById("year").textContent = new Date().getFullYear();

    // 点击切换主题，并记住用户选择（带圆形扩散转场）
    themeToggle.addEventListener("click", function (event) {
      var next =
        document.documentElement.getAttribute("data-theme") === "dark"
          ? "light"
          : "dark";

      // 以点击位置为圆心，计算能覆盖整个屏幕的扩散半径
      var x = event.clientX;
      var y = event.clientY;
      var radius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );
      document.documentElement.style.setProperty("--click-x", x + "px");
      document.documentElement.style.setProperty("--click-y", y + "px");
      document.documentElement.style.setProperty("--click-r", radius + "px");

      var applyTheme = function () {
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      };

      // 支持 View Transitions API 时使用圆形扩散转场，否则直接切换
      if (document.startViewTransition) {
        var rootEl = document.documentElement;
        rootEl.classList.add("vt-active");
        var vt = document.startViewTransition(applyTheme);
        vt.finished.finally(function () {
          rootEl.classList.remove("vt-active");
        });
      } else {
        applyTheme();
      }
    });
  </script>
</body>
</html>
