<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Alan Lumiere 的个人空间" />
  <meta name="color-scheme" content="light dark" />
  <title>Alan Lumiere · 个人空间</title>
  <script>
    // 在样式解析前确定主题，避免暗色用户看到浅色闪烁（FOUC）
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute(
        "data-theme",
        stored || (prefersDark ? "dark" : "light")
      );
    })();
  </script>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2430;
      --text-secondary: #5b6472;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #e6e8ef;
      --radius: 16px;
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --card: #1a1d24;
      --text: #e6e8ee;
      --text-secondary: #9aa3b2;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2e3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .card {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(31, 36, 48, 0.06);
      width: 100%;
      max-width: 560px;
      padding: 48px 40px;
      text-align: center;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--border);
      color: var(--text);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* 浅色主题显示月亮（提示可切暗色），暗色主题显示太阳（提示可切亮色） */
    .icon-sun {
      display: none;
    }
    [data-theme="dark"] .icon-moon {
      display: none;
    }
    [data-theme="dark"] .icon-sun {
      display: block;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 40px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .tagline {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 16px;
    }

    .divider {
      width: 48px;
      height: 3px;
      margin: 24px auto;
      border-radius: 2px;
      background: var(--accent);
    }

    .about {
      text-align: left;
      color: var(--text-secondary);
      font-size: 15px;
    }

    .about p + p {
      margin-top: 10px;
    }

    .links {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .footer {
      margin-top: 24px;
      color: var(--text-secondary);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>

    <div class="avatar" aria-hidden="true">A</div>
    <h1>Alan Lumiere</h1>
    <p class="tagline">欢迎来到我的个人空间</p>
    <div class="divider"></div>

    <section class="about">
      <p>
        你好，我是 Alan。这里是我的个人空间，用来记录和分享我的想法、项目与生活。
      </p>
      <p>
        目前内容还在逐步完善中，敬请期待。
      </p>
    </section>

    <nav class="links">
      <a class="btn btn-primary" href="https://github.com/AlanLumier" target="_blank" rel="noopener">
        GitHub
      </a>
    </nav>
  </main>

  <footer class="footer">
    © <span id="year"></span> Alan Lumiere
  </footer>

  <script>
    var themeToggle = document.getElementById("theme-toggle");

    // 让页脚年份自动更新，避免每年手动修改
    document.getElementById("year").textContent = new Date().getFullYear();

    // 点击切换主题，并记住用户选择
    themeToggle.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme");
      var next = current === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });
  </script>
</body>
</html>
