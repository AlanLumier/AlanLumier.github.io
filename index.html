<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AlanLumier 的个人空间" />
  <meta name="color-scheme" content="light dark" />
  <title>AlanLumier · 个人空间</title>
  <script>
    // 在样式解析前确定主题，避免暗色用户看到浅色闪烁（FOUC）
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute(
        "data-theme",
        stored || (prefersDark ? "dark" : "light")
      );
    })();
  </script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffeae1 0%, #b6faff 100%);
      --text: #1f2430;
      --text-secondary: #5b6472;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #e6e8ef;
      --radius: 16px;
      --glass: rgba(255, 255, 255, 0.55);
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      /* 覆盖中文、日文、韩文、阿拉伯文、天城文、泰文等主要书写系统 */
      --font-display: "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei",
        "Hiragino Sans", "Yu Gothic", "Meiryo", "Malgun Gothic", "Nirmala UI",
        "Leelawadee UI", Tahoma, sans-serif;
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #1a1d24 0%, #0f1115 100%);
      --text: #e6e8ee;
      --text-secondary: #9aa3b2;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2e3a;
      --glass: rgba(26, 29, 36, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      font-family: var(--font-ui);
      background: var(--bg-gradient);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: color 0.3s ease;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .theme-toggle {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--border);
      color: var(--text);
    }

    .theme-toggle morph-icon {
      display: inline-flex;
    }

    /* ---------- 第一块：世界各地的欢迎语 ---------- */

    .welcome {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 96px 24px 104px;
    }

    .welcome-stage {
      width: 100%;
      max-width: 1080px;
      /* 不加 min-width:0 时，nowrap 的整行最小宽度会把这块撑出视口 */
      min-width: 0;
      text-align: center;
    }

    .welcome-line {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.14;
      letter-spacing: 0.01em;
      font-size: 88px;
      transition: opacity 0.6s ease;
    }

    /* 每个字默认不可见，由 is-in / is-out 两个状态驱动动画 */
    .welcome-char {
      display: inline-block;
      opacity: 0;
      will-change: opacity, filter, transform;
    }

    .welcome-stage.is-in .welcome-char {
      animation: char-in var(--char-in-duration) cubic-bezier(0.22, 0.68, 0.24, 1) both;
      animation-delay: calc(var(--i) * var(--char-in-stagger));
    }

    .welcome-stage.is-out .welcome-char {
      animation: char-out var(--char-out-duration) cubic-bezier(0.4, 0, 0.7, 1) both;
      animation-delay: calc(var(--i) * var(--char-out-stagger));
    }

    /* 从虚空中浮现：模糊 + 上浮 + 极轻微放大 */
    @keyframes char-in {
      from {
        opacity: 0;
        filter: blur(14px);
        transform: translateY(0.26em) scale(1.04);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
    }

    /* 再散回虚空 */
    @keyframes char-out {
      from {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
      to {
        opacity: 0;
        filter: blur(16px);
        transform: translateY(-0.22em) scale(0.98);
      }
    }

    .welcome-label {
      margin-top: 22px;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: var(--text-secondary);
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .welcome-stage.is-in .welcome-label {
      opacity: 0.85;
    }

    /* 用户偏好减少动效时：整行淡入淡出，不做逐字动画 */
    .welcome-stage.is-reduced .welcome-char {
      animation: none;
      opacity: 1;
    }

    .welcome-stage.is-reduced .welcome-line {
      opacity: 0;
    }

    .welcome-stage.is-reduced.is-in .welcome-line {
      opacity: 1;
    }

    .welcome-stage.is-reduced.is-out .welcome-line {
      opacity: 0;
    }

    .scroll-cue {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--text-secondary);
      text-decoration: none;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }

    .scroll-cue:hover {
      opacity: 1;
    }

    .scroll-cue svg {
      width: 18px;
      height: 18px;
      animation: cue-bob 1.8s ease-in-out infinite;
    }

    @keyframes cue-bob {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.7;
      }
      50% {
        transform: translateY(5px);
        opacity: 1;
      }
    }

    /* ---------- 第二块：社交 ---------- */

    .social {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 96px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* 锚点跳转时避开顶部固定栏 */
      scroll-margin-top: 76px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 26px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .greeting {
      font-size: 30px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.5px;
      margin-top: 16px;
    }

    .wave {
      display: inline-block;
      animation: wave 1.6s ease-in-out infinite;
      transform-origin: 60% 85%;
      vertical-align: middle;
    }

    .wave-hand {
      display: block;
      width: 0.92em;
      height: 0.92em;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(16deg); }
      40% { transform: rotate(-6deg); }
      60% { transform: rotate(12deg); }
      80% { transform: rotate(-4deg); }
    }

    .tagline {
      margin-top: 12px;
      color: var(--text-secondary);
      font-size: 17px;
    }

    .social-grid {
      width: 100%;
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(248px, 1fr));
      gap: 14px;
    }

    .social-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--glass);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      text-decoration: none;
      color: inherit;
      text-align: left;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .social-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .social-icon {
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--accent);
    }

    .social-icon svg {
      width: 20px;
      height: 20px;
    }

    .social-name {
      font-size: 15px;
      font-weight: 600;
    }

    .social-meta {
      font-size: 13px;
      color: var(--text-secondary);
      word-break: break-all;
    }

    .footer {
      padding: 0 24px 40px;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .footer.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .footer-brand {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    @media (max-width: 600px) {
      .welcome {
        padding: 88px 20px 96px;
      }

      .greeting {
        font-size: 24px;
      }

      .tagline {
        font-size: 15px;
      }
    }

    /* 圆形扩散转场（View Transitions API） */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: circular-reveal 0.5s ease-out;
    }

    @keyframes circular-reveal {
      from {
        clip-path: circle(0 at var(--click-x, 50%) var(--click-y, 50%));
      }
      to {
        clip-path: circle(var(--click-r, 100vmax) at var(--click-x, 50%) var(--click-y, 50%));
      }
    }

    /* 转场播放期间禁用普通 transition，避免新快照捕获到过渡中间色 */
    .vt-active * {
      transition: none !important;
    }
  </style>
</head>

  <script>
    // 第一块：逐字浮现、逐字消散，循环切换语种
    (function () {
      var LANGUAGES = [
        { label: "中文", text: "欢迎你的到来" },
        { label: "English", text: "Welcome" },
        { label: "Español", text: "Bienvenido" },
        { label: "Français", text: "Bienvenue" },
        { label: "Deutsch", text: "Willkommen" },
        { label: "Italiano", text: "Benvenuto" },
        { label: "Português", text: "Bem-vindo" },
        { label: "日本語", text: "ようこそ" },
        { label: "한국어", text: "환영합니다" },
        { label: "Русский", text: "Добро пожаловать" },
        // 阿拉伯文连写，必须整词成形，所以按词而不是按字母入场
        { label: "العربية", text: "أهلاً وسهلاً", dir: "rtl", unit: "word" },
        { label: "हिन्दी", text: "स्वागत है" },
        { label: "ไทย", text: "ยินดีต้อนรับ" },
        { label: "Tiếng Việt", text: "Chào mừng bạn" }
      ];

      var BASE_SIZE = 100; // 测量基准字号，最终字号按可用宽度等比换算
      var MAX_SIZE = 132;
      var MIN_SIZE = 32;
      var IN_DURATION = 760;
      var IN_STAGGER = 85;
      var HOLD = 1250;
      var OUT_DURATION = 560;
      var OUT_STAGGER = 48;
      var GAP = 220;

      var stage = document.getElementById("welcome-stage");
      var line = document.getElementById("welcome-line");
      var label = document.getElementById("welcome-label");
      var section = document.getElementById("welcome");
      if (!stage || !line || !label || !section) return;

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var segmenter =
        typeof Intl !== "undefined" && Intl.Segmenter
          ? new Intl.Segmenter(undefined, { granularity: "grapheme" })
          : null;

      var index = 0;
      var timer = 0;
      var paused = false;

      stage.style.setProperty("--char-in-duration", IN_DURATION + "ms");
      stage.style.setProperty("--char-in-stagger", IN_STAGGER + "ms");
      stage.style.setProperty("--char-out-duration", OUT_DURATION + "ms");
      stage.style.setProperty("--char-out-stagger", OUT_STAGGER + "ms");
      if (reduceMotion.matches) stage.classList.add("is-reduced");

      // 按字素切分，避免把泰文/天城文的组合符号拆散
      function toUnits(text, language) {
        if (language.unit === "word") {
          return text.split(/\s+/).filter(function (word) {
            return word.length > 0;
          });
        }
        if (segmenter) {
          return Array.from(segmenter.segment(text), function (part) {
            return part.segment;
          });
        }
        return Array.from(text);
      }

      // 居中容器溢出时 scrollWidth 只计到一侧，这里直接用首尾字元素量实际宽度
      function contentWidth() {
        var first = line.firstElementChild;
        var last = line.lastElementChild;
        if (!first || !last) return 0;
        return last.getBoundingClientRect().right - first.getBoundingClientRect().left;
      }

      // 字号缩放到整行刚好占满可用宽度；窄屏放不下时允许换行
      function fit() {
        var available = stage.clientWidth;
        if (!available) return;
        line.style.fontSize = BASE_SIZE + "px";
        line.style.flexWrap = "nowrap";
        var measured = contentWidth();
        // 留 2% 余量，避免取整误差触发换行
        var size = measured > 0 ? (BASE_SIZE * available * 0.98) / measured : MAX_SIZE;
        line.style.fontSize = Math.max(MIN_SIZE, Math.min(MAX_SIZE, size)) + "px";
        if (contentWidth() > available) line.style.flexWrap = "wrap";
      }

      function render(language) {
        stage.classList.remove("is-in", "is-out");
        line.textContent = "";
        line.setAttribute("dir", language.dir || "ltr");
        var units = toUnits(language.text, language);
        line.style.gap = language.unit === "word" ? "0.26em" : "0";

        units.forEach(function (unit, i) {
          var span = document.createElement("span");
          span.className = "welcome-char";
          span.textContent = unit;
          span.style.setProperty("--i", i);
          line.appendChild(span);
        });

        label.textContent = language.label;
        fit();
      }

      function play() {
        if (paused) return;
        var language = LANGUAGES[index];
        index = (index + 1) % LANGUAGES.length;
        render(language);

        var count = line.children.length;
        var inMs = IN_DURATION + (count - 1) * IN_STAGGER;

        if (reduceMotion.matches) {
          stage.classList.add("is-in");
          timer = window.setTimeout(function () {
            stage.classList.remove("is-in");
            stage.classList.add("is-out");
            timer = window.setTimeout(play, 900);
          }, 3200);
          return;
        }

        stage.classList.add("is-in");
        timer = window.setTimeout(function () {
          stage.classList.remove("is-in");
          stage.classList.add("is-out");
          var outMs = OUT_DURATION + (count - 1) * OUT_STAGGER;
          timer = window.setTimeout(play, outMs + GAP);
        }, inMs + HOLD);
      }

      // 滑到社交区块后暂停，避免离屏空转
      if ("IntersectionObserver" in window) {
        new IntersectionObserver(
          function (entries) {
            if (entries[0].isIntersecting) {
              if (paused) {
                paused = false;
                play();
              }
            } else if (!paused) {
              paused = true;
              window.clearTimeout(timer);
            }
          },
          { threshold: 0.2 }
        ).observe(section);
      }

      window.addEventListener("resize", fit);
      play();
    })();
  </script>

  <script>
    // 页脚淡入：进入视口时添加 is-visible 类触发淡入
    (function () {
      var footerEl = document.getElementById("footer");
      if (!footerEl) return;
      if ("IntersectionObserver" in window) {
        var footerObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              footerEl.classList.add("is-visible");
              footerObserver.unobserve(footerEl);
            }
          });
        }, { threshold: 0.15 });
        footerObserver.observe(footerEl);
      } else {
        footerEl.classList.add("is-visible");
      }
    })();
  </script>

      ["line", { x1: "4.22", y1: "4.22", x2: "5.64", y2: "5.64" }],
      ["line", { x1: "18.36", y1: "18.36", x2: "19.78", y2: "19.78" }],
      ["line", { x1: "1", y1: "12", x2: "3", y2: "12" }],
      ["line", { x1: "21", y1: "12", x2: "23", y2: "12" }],
      ["line", { x1: "4.22", y1: "19.78", x2: "5.64", y2: "18.36" }],
      ["line", { x1: "18.36", y1: "5.64", x2: "19.78", y2: "4.22" }]
    ];

    var themeToggle = document.getElementById("theme-toggle");
    var themeIcon = document.getElementById("theme-icon");
    var isDark = function () {
      return document.documentElement.getAttribute("data-theme") === "dark";
    };

    // 初始图标（birth，不触发动画）
    themeIcon.icon = isDark() ? SUN : MOON;

    // 点击切换主题（圆形扩散转场 + 图标形变）
    themeToggle.addEventListener("click", function (event) {
      var next = isDark() ? "light" : "dark";

      var x = event.clientX;
      var y = event.clientY;
      var radius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );
      document.documentElement.style.setProperty("--click-x", x + "px");
      document.documentElement.style.setProperty("--click-y", y + "px");
      document.documentElement.style.setProperty("--click-r", radius + "px");

      var applyTheme = function () {
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      };

      if (document.startViewTransition) {
        var rootEl = document.documentElement;
        rootEl.classList.add("vt-active");
        var vt = document.startViewTransition(applyTheme);
        vt.finished.finally(function () {
          rootEl.classList.remove("vt-active");
        });
      } else {
        applyTheme();
      }

      // 月亮 ↔ 太阳形变
      themeIcon.morphTo(next === "dark" ? SUN : MOON, "snappy");
    });
  </script>

</body>
</html>
