<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AlanLumier 的个人空间" />
  <meta name="color-scheme" content="light dark" />
  <title>AlanLumier · 个人空间</title>
  <script>
    // 在样式解析前确定主题，避免暗色用户看到浅色闪烁（FOUC）
    (function () {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute(
        "data-theme",
        stored || (prefersDark ? "dark" : "light")
      );
    })();
  </script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #ffeae1 0%, #b6faff 100%);
      --text: #1f2430;
      --text-secondary: #5b6472;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --border: #e6e8ef;
      --radius: 16px;
      --glass: rgba(255, 255, 255, 0.55);
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #1a1d24 0%, #0f1115 100%);
      --text: #e6e8ee;
      --text-secondary: #9aa3b2;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2e3a;
      --glass: rgba(26, 29, 36, 0.55);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: 84px;
      transition: color 0.3s ease;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--glass);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .hero {
      width: 100%;
      max-width: 720px;
      padding: 24px;
      text-align: center;
    }

    .greeting {
      font-size: 44px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: 0.5px;
      margin-top: 24px;
    }

    .wave {
      display: inline-block;
      animation: wave 1.6s ease-in-out infinite;
      transform-origin: 60% 85%;
      vertical-align: middle;
    }

    .wave-hand {
      display: block;
      width: 0.92em;
      height: 0.92em;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(16deg); }
      40% { transform: rotate(-6deg); }
      60% { transform: rotate(12deg); }
      80% { transform: rotate(-4deg); }
    }

    @media (max-width: 480px) {
      .greeting {
        font-size: 32px;
      }
    }

    .theme-toggle {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--border);
      color: var(--text);
    }

    .theme-toggle morph-icon {
      display: inline-flex;
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 44px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tagline {
      margin-top: 16px;
      color: var(--text-secondary);
      font-size: 18px;
    }

    .links {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 48px;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .footer.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .footer-brand {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* 圆形扩散转场（View Transitions API） */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      animation: circular-reveal 0.5s ease-out;
    }

    @keyframes circular-reveal {
      from {
        clip-path: circle(0 at var(--click-x, 50%) var(--click-y, 50%));
      }
      to {
        clip-path: circle(var(--click-r, 100vmax) at var(--click-x, 50%) var(--click-y, 50%));
      }
    }

    /* 转场播放期间禁用普通 transition，避免新快照捕获到过渡中间色 */
    .vt-active * {
      transition: none !important;
    }

  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand">AlanLumier</span>
    <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
      <morph-icon id="theme-icon" size="20" stroke-width="2" color="currentColor"></morph-icon>
    </button>
  </header>

  <main class="hero">
    <div class="avatar" aria-hidden="true">A</div>
    <h1 class="greeting">你好，我是 AlanLumier <span class="wave" aria-hidden="true"><svg class="wave-hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></span></h1>
    <p class="tagline">欢迎来到我的个人空间</p>

    <nav class="links">
      <a class="btn btn-primary" href="https://github.com/AlanLumier" target="_blank" rel="noopener">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.73.083-.73 1.205.085 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.605-2.665-.305-5.467-1.334-5.467-5.93 0-1.31.468-2.38 1.235-3.22-.123-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.3 1.23a11.5 11.5 0 0 1 3.003-.404c1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.873.118 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.807 5.624-5.48 5.92.43.372.814 1.102.814 2.222 0 1.606-.015 2.898-.015 3.293 0 .322.216.694.825.576C20.565 21.796 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </a>
    </nav>
  </main>

  <footer class="footer" id="footer">
    <span class="footer-brand">AlanLumier</span>
  </footer>

  <script>
    // 页脚淡入：进入视口时添加 is-visible 类触发淡入
    var footerEl = document.getElementById("footer");
    if ("IntersectionObserver" in window) {
      var footerObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            footerEl.classList.add("is-visible");
            footerObserver.unobserve(footerEl);
          }
        });
      }, { threshold: 0.15 });
      footerObserver.observe(footerEl);
    } else {
      footerEl.classList.add("is-visible");
    }
  </script>

  <script src="./dist/morphicons.bundle.js"></script>
  <script>
    defineMorphIcon();

    var MOON = [["path", { d: "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" }]];
    var SUN = [
      ["circle", { cx: "12", cy: "12", r: "5" }],
      ["line", { x1: "12", y1: "1", x2: "12", y2: "3" }],
      ["line", { x1: "12", y1: "21", x2: "12", y2: "23" }],
      ["line", { x1: "4.22", y1: "4.22", x2: "5.64", y2: "5.64" }],
      ["line", { x1: "18.36", y1: "18.36", x2: "19.78", y2: "19.78" }],
      ["line", { x1: "1", y1: "12", x2: "3", y2: "12" }],
      ["line", { x1: "21", y1: "12", x2: "23", y2: "12" }],
      ["line", { x1: "4.22", y1: "19.78", x2: "5.64", y2: "18.36" }],
      ["line", { x1: "18.36", y1: "5.64", x2: "19.78", y2: "4.22" }]
    ];

    var themeToggle = document.getElementById("theme-toggle");
    var themeIcon = document.getElementById("theme-icon");
    var isDark = function () {
      return document.documentElement.getAttribute("data-theme") === "dark";
    };

    // 初始图标（birth，不触发动画）
    themeIcon.icon = isDark() ? SUN : MOON;

    // 点击切换主题（圆形扩散转场 + 图标形变）
    themeToggle.addEventListener("click", function (event) {
      var next = isDark() ? "light" : "dark";

      var x = event.clientX;
      var y = event.clientY;
      var radius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );
      document.documentElement.style.setProperty("--click-x", x + "px");
      document.documentElement.style.setProperty("--click-y", y + "px");
      document.documentElement.style.setProperty("--click-r", radius + "px");

      var applyTheme = function () {
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      };

      if (document.startViewTransition) {
        var rootEl = document.documentElement;
        rootEl.classList.add("vt-active");
        var vt = document.startViewTransition(applyTheme);
        vt.finished.finally(function () {
          rootEl.classList.remove("vt-active");
        });
      } else {
        applyTheme();
      }

      // 月亮 ↔ 太阳形变
      themeIcon.morphTo(next === "dark" ? SUN : MOON, "snappy");
    });
  </script>

</body>
</html>
